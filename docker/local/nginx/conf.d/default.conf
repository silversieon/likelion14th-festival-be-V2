server {
	listen 80;
	server_name localhost;

	location /api/orders/subscribe {
		proxy_pass http://festival-app;
		proxy_http_version 1.1;
		proxy_set_header Connection "";

        proxy_buffering off;      # 이벤트를 모아두지 않고 바로 전달
        proxy_cache off;
        proxy_read_timeout 60s;   # heartbeat(20초)의 3배. 서버가 60초간 아무것도 못 보내면 끊고 재연결시킨다
    }

    location / {
        proxy_pass http://festival-app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}