# 운영 환경용 앱 컨테이너 Compose 파일
services:
  app:
    image: ${DOCKER_USERNAME}/${PROD_DOCKER_REPO}:latest
    container_name: festival-prod
    ports:
      - "8080:8080"
    environment:
      # Spring 설정
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      TZ: Asia/Seoul

      # Database 설정
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 20
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 5

      # Redis 설정
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASS}

      # JVM 옵션
      JAVA_OPTS: >-
        -Xms512m
        -Xmx1024m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/app/logs
        -Dfile.encoding=UTF-8
        -Duser.timezone=Asia/Seoul
        -Djava.security.egd=file:/dev/./urandom

      # 로깅 설정
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_YOURPACKAGE: INFO

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    networks:
      - festival-network

    restart: always

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    volumes:
      - app-logs:/app/logs

networks:
  festival-network:
    external: true

volumes:
  app-logs:
    driver: local