global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 2m
  external_labels:
    monitor: 'festival-monitor'

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "spring-actuator-local-01"
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['festival-app-01:8080', 'festival-app-02:8080', 'festival-app-03:8080']