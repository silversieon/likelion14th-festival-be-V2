global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 2m
  external_labels:
    monitor: 'festival-monitor'

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"

  - job_name: "spring-actuator-dev"
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['52.79.50.148:8080', '52.79.50.148:8081']
        labels:
          app: "festival-dev"