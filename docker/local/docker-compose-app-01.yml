services:
  festival-app-01:
    build:
      context: ../..
      dockerfile: docker/local/Dockerfile-local
    container_name: festival-app-01
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Seoul
      INSTANCE_ID: app-01
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/festival2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: 1234

      JAVA_OPTS: >-
        -Xms1g
        -Xmx1g
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Dfile.encoding=UTF-8
        -Duser.timezone=Asia/Seoul

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    cpuset: "0,1"

    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G

    networks:
      - festival-network
    restart: no

networks:
  festival-network:
    driver: bridge
    external: true